[package]
name = "fdr"
version = "0.0.1"
description = "FDR"
authors = ["hieudoanm <hieumdoan@gmail.com>"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib",
]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
log = "=0.4.35"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-log = "=2.10.1"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-updater = "=2.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
