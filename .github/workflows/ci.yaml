name: CI

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-quality:
    name: CLI - Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Run lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  cli-build:
    name: CLI - Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-quality` job.
    if: github.event_name != 'pull_request'
    needs: cli-quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Build release binary
        run: cargo build --release -p fdr-cli
      - name: Rename binaries for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) suffix=x86_64-unknown-linux-gnu ;;
            macos-latest) suffix=aarch64-apple-darwin ;;
            windows-latest) suffix=x86_64-pc-windows-msvc ;;
          esac
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/release/fdr.exe "fdr-${suffix}.exe"
          else
            mv target/release/fdr "fdr-${suffix}"
          fi
      - name: Upload CLI binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fdr-cli-${{ matrix.os }}
          path: fdr-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [cli-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: fdr-cli-*
          merge-multiple: true
      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: FDR (latest)
          body_path: RELEASE.md
          files: dist/*

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      # The site is served from https://hieudoanm.github.io/fdr, so the static
      # export needs the project base path baked in at build time.
      - name: Build
        env:
          BASE_PATH: /fdr
        run: pnpm build
      - name: Disable Jekyll
        run: touch packages/landing/out/.nojekyll
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out/
          retention-days: 1

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
